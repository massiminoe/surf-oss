[package]
name = "surf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "winit app loop for osx-surf"
default-run = "osx-surf"

[lib]
name = "surf_app"
path = "src/lib.rs"

[[bin]]
name = "osx-surf"
path = "src/main.rs"

[[bin]]
name = "ksf-import"
path = "src/bin/ksf_import.rs"

[[example]]
name = "ksf_resim_audit"
path = "examples/ksf_resim_audit.rs"

[[example]]
name = "snag_probe"
path = "examples/snag_probe.rs"

[[example]]
name = "surface_scan"
path = "examples/surface_scan.rs"

[[example]]
name = "ghost_eye"
path = "examples/ghost_eye.rs"

[[example]]
name = "ramp_tour"
path = "examples/ramp_tour.rs"

[[example]]
name = "ramp_surface_audit"
path = "examples/ramp_surface_audit.rs"

[dependencies]
surf-core = { workspace = true }
surf-map = { workspace = true }
surf-render = { workspace = true }
surf-audio = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
